# ==============================================================================
# Configuração de Build, Rotas Serverless e Cabeçalhos de Segurança — Netlify
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Encaminha todas as rotas da API REST para a função serverless Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Encaminha callbacks OAuth (Google / GitHub) para o backend serverless
[[redirects]]
  from = "/auth/callback/*"
  to = "/.netlify/functions/api/auth/callback/:splat"
  status = 200
  force = true

# Fallback do Single Page Application (SPA) React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos HTTP defensivos (HSTS, proteção XSS/MIME sniffing e CSP restritiva)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://avatars.githubusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://aistudio.google.com https://*.google.com https://*.netlify.app;"

# Cache imutável de longo prazo para assets versionados do Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
